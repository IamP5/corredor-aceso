# A solução inteira com um comando: docker compose up --build
# Só precisa do Docker. O .NET, o Node e o Python ficam dentro das imagens.
#
#   API e Swagger   http://localhost:5080/swagger
#   App da ACS      http://localhost:8081  (código dev-acs-demo-01-so-no-notebook, microárea 3)
#   Painel da Guarda http://localhost:5080/api/guarda/demo/painel
#
# Começar do zero: docker compose down -v
# Senhas fixas de propósito: os serviços só existem na rede do compose, e só a API e o app
# ficam expostos em 127.0.0.1.
name: corredor

x-senhas: &senhas
  PGSENHA: corredor-dev
  SENHA_MIGRA: dev-migra
  SENHA_API: dev-api
  BANCO: corredor_demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corredor
      POSTGRES_PASSWORD: corredor-dev
      POSTGRES_DB: corredor
    volumes: [banco:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "corredor"]
      interval: 2s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    volumes: ["./infra/config/dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  # Papéis, migrações e carga das 40 casas. Roda e sai. Rodar de novo não muda nada.
  preparar:
    build: { context: ., dockerfile: tools/docker/api.Dockerfile }
    image: corredor-api
    entrypoint: ["preparar"]
    environment:
      <<: *senhas
      ASPNETCORE_ENVIRONMENT: Development
      Logging__Console__FormatterName: simple
      ConnectionStrings__Motor: Host=postgres;Database=corredor_demo;Username=corredor_motor;Password=dev-api
      ConnectionStrings__Cadastro: Host=postgres;Database=corredor_demo;Username=corredor_cadastro;Password=dev-api
      ConnectionStrings__Guarda: Host=postgres;Database=corredor_demo;Username=corredor_guarda;Password=dev-api
    volumes: [semente:/semente]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: corredor-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Motor: Host=postgres;Database=corredor_demo;Username=corredor_motor;Password=dev-api
      ConnectionStrings__Cadastro: Host=postgres;Database=corredor_demo;Username=corredor_cadastro;Password=dev-api
      ConnectionStrings__Guarda: Host=postgres;Database=corredor_demo;Username=corredor_guarda;Password=dev-api
      Mqtt__Host: mosquitto
      Logging__Console__FormatterName: simple
      # Lidos do .env da raiz, se existir. Sem chave, a Guarda usa uma frase fixa.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    ports: ["127.0.0.1:5080:5080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5080/healthz/ready"]
      interval: 3s
      retries: 40
    depends_on:
      preparar: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }

  # As 39 casas simuladas, publicando no mesmo contrato MQTT do nó do Wokwi.
  simulador:
    build: { context: ., dockerfile: tools/docker/simulador.Dockerfile }
    command: ["--host", "mosquitto", "--cenario", "demo"]
    environment: { PYTHONUNBUFFERED: "1" }
    volumes: [semente:/repo/api/semente:ro]
    depends_on:
      api: { condition: service_healthy }

  # App da ACS no navegador. O navegador roda no seu computador, por isso a API é localhost:5080.
  app:
    build: { context: ., dockerfile: tools/docker/app.Dockerfile }
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:5080
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      api: { condition: service_healthy }

  # Notebook e job das 05h. Não sobe com o "up": use docker compose run --rm ml <comando>.
  ml:
    build: { context: ., dockerfile: tools/docker/ml.Dockerfile }
    profiles: [ml]
    environment:
      CORREDOR_API_URL: http://api:5080
    volumes: ["./ml:/repo/ml"]

volumes:
  banco:
  semente:
