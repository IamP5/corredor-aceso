# Dependências da API no notebook de quem desenvolve: Postgres e Mosquitto.
# Não é o ambiente avaliado. A VM é provisionada pelos scripts Bash de infra/.
# Senha fixa de propósito: só vale em localhost.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corredor
      POSTGRES_PASSWORD: corredor-dev
      POSTGRES_DB: corredor
    ports: ["127.0.0.1:5432:5432"]
    volumes: [corredor-pg:/var/lib/postgresql/data]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./infra/config/dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
volumes:
  corredor-pg:
