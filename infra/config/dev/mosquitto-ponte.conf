# Ponte do notebook até o broker público, para o nó do Wokwi falar com a API local sem a VM.
# Roda no macOS, fora do Docker, ao lado do Mosquitto do compose.dev.yml:
#   mosquitto -c infra/config/dev/mosquitto-ponte.conf
# Dentro do Colima, o Mosquitto (musl) não resolve broker.hivemq.com, porque a consulta AAAA estoura o
# tempo. Por isso este broker roda no macOS e liga as duas pontas: o broker público e o do compose.
# O prefixo é o MQTT_PREFIXO_PUBLICO de corredor.conf.padrao e o MQTT_PREFIXO de iot/no/config.h.
listener 1884 127.0.0.1
allow_anonymous false

# Broker público: traz os eventos do nó e leva os comandos, como a ponte da VM.
connection corredor-ponte-publica
address broker.hivemq.com:1883
remote_clientid corredor-ponte-dev-40028922
cleansession true
bridge_protocol_version mqttv311
try_private false
notifications false
restart_timeout 5 30
topic +/evento in 1 corredor/v1/ corredor-aceso-40028922/corredor/v1/
topic +/comando out 1 corredor/v1/ corredor-aceso-40028922/corredor/v1/

# Broker do compose.dev.yml, onde a API escuta.
connection corredor-ponte-compose
address 127.0.0.1:1883
remote_clientid corredor-ponte-dev-compose
cleansession true
try_private false
notifications false
restart_timeout 2 10
topic corredor/v1/+/evento out 1
topic corredor/v1/+/comando in 1
